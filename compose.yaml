services:
  web:
    build: .
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5.4-mini}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_URL: http://lightrag:9621
      REDIS_URL: redis://redis:6379/0
      KB_VERSION: ${KB_VERSION:-plimo-demo-v2}
      RAG_MODE: ${RAG_MODE:-mix}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEMBER_DB: /app/data/members.sqlite3
    volumes:
      - member-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  lightrag:
    profiles: ["rag"]
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:latest}
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      WHITELIST_PATHS: /health
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.openai.com/v1
      LLM_BINDING_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: https://api.openai.com/v1
      EMBEDDING_BINDING_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIM: 1536
      SUMMARY_LANGUAGE: Thai
      ENABLE_LLM_CACHE: "true"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      RERANK_BINDING: "null"
    volumes:
      - rag-data-demo-v2:/app/data/rag_storage
      - rag-inputs:/app/data/inputs
    restart: unless-stopped
volumes:
  member-data:
  redis-data:
  rag-data-demo-v2:
  rag-inputs:
