events {}
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # Real client IP from the HTTPS proxy (Caddy) on the private Docker network only;
  # a forged X-Forwarded-For from the internet never reaches this hop.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # Per-IP ceilings sized for a classroom behind one NAT; per-member/session quotas live in the API.
  limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
  limit_req_status 429;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Link previews need absolute URLs: pages say __ORIGIN__ and get the real host at serve time (any domain, no rebuild).
    sub_filter_types text/html;
    sub_filter '__ORIGIN__' 'https://$host';
    sub_filter_once off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:png|jpg|jpeg|webp|svg|woff2?)$ { expires 7d; try_files $uri =404; }
    # Code and pages always revalidate (304 when unchanged), so a deploy never leaves stale JS running.
    location ~* \.(?:js|css|json|html)$ { expires -1; try_files $uri =404; }
    location = /api/chat {
      limit_req zone=chat burst=20 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }
    location = /api/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /api/auth/register {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ^~ /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }
  }
}
