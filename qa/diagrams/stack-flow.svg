<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>
text{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Thonburi",Arial,sans-serif;fill:#1d1d1f}
.h1{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#6e6e73}
.group{font-size:14px;font-weight:600;fill:#6e6e73;letter-spacing:.02em}
.title{font-size:18px;font-weight:700}.line{font-size:14px;fill:#3a3a3c}.step{font-size:14px;fill:#1d1d1f}
.label{font-size:12px;fill:#6e6e73}.foot{font-size:15px;fill:#3a3a3c}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a8f98"/></marker></defs><rect width="1600" height="1000" fill="#fbfbfd"/><text x="40" y="54" class="h1">Plimo — System Architecture</text><text x="40" y="84" class="sub">LLM-first Thai chatbot for an iPhone repair shop · Ubuntu VPS · Docker Compose · https://203-156-66-86.sslip.io · Oct 2026</text><rect x="40" y="150" width="230" height="104" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="40" y="160" width="4" height="84" rx="2" fill="#6e6e73"/><text x="58" y="178" class="title">Customer (guest)</text><text x="58" y="202" class="line">Storefront + chat widget</text><text x="58" y="223" class="line">Thai text + up to 3 photos</text><text x="58" y="244" class="line">iPhone HEIC supported</text><rect x="40" y="280" width="230" height="104" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="40" y="290" width="4" height="84" rx="2" fill="#6e6e73"/><text x="58" y="308" class="title">Member</text><text x="58" y="332" class="line">Chat history, own cases</text><text x="58" y="353" class="line">Open / track case PLM-xxxxx</text><text x="58" y="374" class="line">Approve quote, pay online</text><rect x="40" y="410" width="230" height="104" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="40" y="420" width="4" height="84" rx="2" fill="#6e6e73"/><text x="58" y="438" class="title">Admin</text><text x="58" y="462" class="line">Case board, status flow</text><text x="58" y="483" class="line">AI case assist + insights</text><text x="58" y="504" class="line">Metrics, daily AI cost</text><line x1="270" y1="202" x2="300" y2="202" stroke="#8a8f98" stroke-width="2"/><line x1="270" y1="332" x2="300" y2="332" stroke="#8a8f98" stroke-width="2"/><line x1="270" y1="462" x2="300" y2="462" stroke="#8a8f98" stroke-width="2"/><polyline points="300,462 300,202 338,202" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="310" y="110" width="880" height="720" rx="18" fill="#f2f3f5" stroke="#d6d8dc" stroke-dasharray="6 5"/><text x="328" y="136" class="group">Ubuntu VPS · Docker Compose (images pinned, API runs as non-root)</text><rect x="340" y="150" width="200" height="104" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="340" y="160" width="4" height="84" rx="2" fill="#0a84ff"/><text x="358" y="178" class="title">Caddy</text><text x="358" y="202" class="line">HTTPS · Let’s Encrypt</text><text x="358" y="223" class="line">HSTS</text><polyline points="440,254 440,288" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="290" width="200" height="160" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="340" y="300" width="4" height="140" rx="2" fill="#0a84ff"/><text x="358" y="318" class="title">nginx</text><text x="358" y="342" class="line">Static UI (HTML/CSS/JS)</text><text x="358" y="363" class="line">CSP + security headers</text><text x="358" y="384" class="line">Chat 30 req/min per IP</text><text x="358" y="405" class="line">Proxy /api → FastAPI</text><polyline points="540,370 578,370" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="580" y="150" width="380" height="650" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="580" y="160" width="4" height="630" rx="2" fill="#0a84ff"/><text x="598" y="178" class="title">FastAPI · Python 3.12</text><text x="598" y="202" class="step">1. Input guards: mask card / national ID,</text><text x="598" y="223" class="line">    block obvious prompt injection</text><text x="598" y="244" class="step">2. Images: quality check → moderation →</text><text x="598" y="265" class="line">    vision triage (device / slip / card / other)</text><text x="598" y="286" class="step">3. Cache lookup (fast · router · answer)</text><text x="598" y="307" class="step">4. Router LLM → intent JSON (9 intents),</text><text x="598" y="328" class="line">    models, services, case number</text><text x="598" y="349" class="line">5a. case / payment → SQLite (no LLM)</text><text x="598" y="370" class="line">5b. shop / price / advice → retrieval +</text><text x="598" y="391" class="line">     catalog prices → answer LLM</text><text x="598" y="412" class="step">6. Output validator: only catalog-backed</text><text x="598" y="433" class="line">    prices, no hidden-context leaks</text><text x="598" y="454" class="step">7. Actions only after &quot;ยืนยัน&quot; (confirm)</text><text x="598" y="475" class="line"></text><text x="598" y="496" class="line">Admin AI assist: summary, next status,</text><text x="598" y="517" class="line">  quote from catalog (validated)</text><text x="598" y="538" class="line">Stripe Checkout + signed webhook</text><text x="598" y="559" class="line">Budget/day · limits per member/session/IP</text><text x="598" y="580" class="line">Single-flight: one model call per question</text><rect x="1000" y="150" width="170" height="150" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1000" y="160" width="4" height="130" rx="2" fill="#30a46c"/><text x="1018" y="178" class="title">Redis 7.4</text><text x="1018" y="202" class="step">6 cache layers</text><text x="1018" y="223" class="line">answers 7 days</text><text x="1018" y="244" class="line">rate limits, budget</text><text x="1018" y="265" class="line">chat context 24 h</text><rect x="1000" y="320" width="170" height="120" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1000" y="330" width="4" height="100" rx="2" fill="#30a46c"/><text x="1018" y="348" class="title">SQLite (WAL)</text><text x="1018" y="372" class="line">users, chats</text><text x="1018" y="393" class="line">cases, quotes</text><text x="1018" y="414" class="line">payments, audit</text><rect x="1000" y="478" width="170" height="128" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1000" y="488" width="4" height="108" rx="2" fill="#30a46c"/><text x="1018" y="506" class="title">Knowledge</text><text x="1018" y="530" class="line">knowledge/*.md (~6 pp)</text><text x="1018" y="551" class="line">+ catalog.json</text><text x="1018" y="572" class="line">ingest --ensure</text><text x="1018" y="593" class="line">on every deploy</text><rect x="1000" y="640" width="170" height="130" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1000" y="650" width="4" height="110" rx="2" fill="#30a46c"/><text x="1018" y="668" class="title">LightRAG</text><text x="1018" y="692" class="line">naive vector search</text><text x="1018" y="713" class="step">53 sections</text><text x="1018" y="734" class="line">top-3 to answer</text><polyline points="960,225 998,225" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><polyline points="960,380 998,380" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><polyline points="960,705 998,705" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><polyline points="1085,606 1085,638" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="1210" y="110" width="350" height="720" rx="18" fill="#f2f3f5" stroke="#d6d8dc" stroke-dasharray="6 5"/><text x="1228" y="136" class="group">External services</text><rect x="1230" y="150" width="310" height="210" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1230" y="160" width="4" height="190" rx="2" fill="#8e5cf7"/><text x="1248" y="178" class="title">OpenAI</text><text x="1248" y="202" class="line">gpt-5.4-mini · Responses API</text><text x="1248" y="223" class="line">router (JSON schema)</text><text x="1248" y="244" class="line">answers + vision</text><text x="1248" y="265" class="line">omni-moderation (images)</text><text x="1248" y="286" class="line">text-embedding-3-small</text><text x="1248" y="307" class="line">prompt caching (static prefix)</text><rect x="1230" y="400" width="310" height="120" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1230" y="410" width="4" height="100" rx="2" fill="#8e5cf7"/><text x="1248" y="428" class="title">Stripe (test mode)</text><text x="1248" y="452" class="line">Checkout page (card never</text><text x="1248" y="473" class="line">touches our server)</text><text x="1248" y="494" class="line">webhook: HMAC + replay guard</text><rect x="1230" y="690" width="310" height="110" rx="12" fill="#ffffff" stroke="#d6d8dc"/><rect x="1230" y="700" width="4" height="90" rx="2" fill="#8e5cf7"/><text x="1248" y="718" class="title">Cloudflare R2</text><text x="1248" y="742" class="line">private bucket</text><text x="1248" y="763" class="line">member photos + slips (EXIF removed)</text><polyline points="900,150 900,132 1200,132 1200,200 1228,200" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><text x="1010" y="126" class="label">LLM calls</text><polyline points="960,459 1228,459" fill="none" stroke="#8a8f98" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><polyline points="960,787 1228,787" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="560" width="230" height="240" rx="12" fill="#fff8e6" stroke="#d6d8dc"/><rect x="40" y="570" width="4" height="220" rx="2" fill="#d9a400"/><text x="58" y="588" class="title">Design rules</text><text x="58" y="612" class="line">The model proposes,</text><text x="58" y="633" class="line">the system confirms.</text><text x="58" y="654" class="line">Prices, case status and</text><text x="58" y="675" class="line">payments always come</text><text x="58" y="696" class="line">from the database.</text><text x="58" y="717" class="line"></text><text x="58" y="738" class="line">Failures are never</text><text x="58" y="759" class="line">cached.</text><text x="40" y="880" class="foot">Tested on the VPS: answer eval 143/143 · API 24/24 endpoints · prompt do/don’t rules 33/33 · OWASP security 51/51 · case lifecycle 16/16 · Stripe test payment · unit 101/101</text><text x="40" y="910" class="foot">Cost ≈ $0.0028 per new answer; repeated questions are served from cache in milliseconds. Member chats and cases stay in SQLite, never in the shared RAG index.</text></svg>